<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talento – דשבורד</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="talento.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
console.log('PRE MODULE SCRIPT EXECUTED');
</script>


<script>
(function() {
  var closeTimer = null;
  var currentOpen = null;
  function openMenu(wrapper) {
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    if (currentOpen && currentOpen !== wrapper) {
      var other = currentOpen.querySelector('.dropdown-menu');
      if (other) other.classList.remove('open');
    }
    currentOpen = wrapper;
    var menu = wrapper.querySelector('.dropdown-menu');
    if (menu) menu.classList.add('open');
  }
  function closeMenu(wrapper) {
    closeTimer = setTimeout(function() {
      var menu = wrapper.querySelector('.dropdown-menu');
      if (menu) menu.classList.remove('open');
      if (currentOpen === wrapper) currentOpen = null;
    }, 250);
  }
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.nav-dropdown').forEach(function(wrapper) {
      wrapper.addEventListener('mouseenter', function() { openMenu(wrapper); });
      wrapper.addEventListener('mouseleave', function() { closeMenu(wrapper); });
      var menu = wrapper.querySelector('.dropdown-menu');
      if (menu) {
        menu.addEventListener('mouseenter', function() { openMenu(wrapper); });
        menu.addEventListener('mouseleave', function() { closeMenu(wrapper); });
      }
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-dropdown')) {
        document.querySelectorAll('.dropdown-menu.open').forEach(function(m) { m.classList.remove('open'); });
        currentOpen = null;
      }
    });
  });
})();
</script>
<script type="module">
import { watchCandidates, watchJobs, watchReferrals, getFixes } from './firebase.js';
import { getDashboardCandidateStats, getHebrewMonthName } from './syncLogic.js';

console.log('[dashboard] MODULE LOADED - firestore sync active');
console.log('[dashboard] firebase import OK');
console.log('[dashboard] syncLogic import OK');

window.onerror = function(message, source, line, col, error) {
 console.error('[dashboard][GLOBAL ERROR]', {
  message,
  source,
  line,
  col,
  stack: error?.stack
 });
};
window.addEventListener('unhandledrejection', function(e) {
 console.error('[dashboard][PROMISE REJECTION]', e.reason);
});

console.log('[dashboard] attaching watchCandidates');

function updateDashboard(candidates) {
  const stats = getDashboardCandidateStats(candidates, null);
  console.log('[dashboard] stats', stats);

  // Top stat cards
  document.getElementById('s1').textContent = stats.inProcess;
  document.getElementById('s3').textContent = stats.hiredThisMonth;
  document.getElementById('s4').textContent = stats.hiredThisMonth;

  // New candidates bar chart – last 7 months
  const now = new Date();
  const monthLabels = [];
  const monthData = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    monthLabels.push(getHebrewMonthName(d.getMonth()));
    monthData.push(stats.byMonth[key] || 0);
  }
  const barChart = Chart.getChart('barChart');
  if (barChart) {
    barChart.data.labels = monthLabels;
    barChart.data.datasets[0].data = monthData;
    barChart.update();
  }
  // Update widget number in "מועמדים שנכנסו"
  const enteredWidget = document.querySelector('#barChart').closest('.widget');
  if (enteredWidget) {
    const numEl = enteredWidget.querySelector('.widget-num');
    if (numEl) numEl.textContent = stats.newThisMonth;
  }

  // Recruitment sources donut
  const src = stats.bySource;
  const srcLabels = ['לידים', 'דרושים', 'פייסבוק', 'אחר'];
  const srcKeyMap = { 'לידים': 'לידים', 'דרושים': 'דרושים', 'פייסבוק': 'פייסבוק', 'אחר': 'אחר' };
  const srcData = srcLabels.map(l => src[l] || 0);
  const donutChart = Chart.getChart('donutChart');
  if (donutChart) {
    donutChart.data.datasets[0].data = srcData;
    donutChart.update();
  }
  const topSourceWidget = document.querySelector('#donutChart').closest('.widget');
  if (topSourceWidget) {
    const numEl = topSourceWidget.querySelector('.widget-num');
    if (numEl) numEl.textContent = Object.keys(src).length;
  }

  // In-process breakdown bars
  const st = stats.byStatus;
  const processWidget = document.querySelector('#barChart').closest('.widget') ||
    document.querySelectorAll('.widget')[1];
  // Update individual bars
  const interviewCount = st['תואם ראיון'] || 0;
  const securityCount  = st['נשלח ביטחון'] || 0;
  const passedSecurity = st['עבר ביטחון'] || 0;
  const startedCount   = st['התחיל לעבוד'] || 0;
  updateBarRow('תואם ראיון', interviewCount);
  updateBarRow('נשלח ביטחון', securityCount);
  updateBarRow('הגיע – המתנה', 0);
  updateBarRow('עבר ביטחון', passedSecurity);
  updateBarRow('התחיל לעבוד', startedCount);
}

function updateBarRow(label, count) {
  document.querySelectorAll('.bar-row').forEach(row => {
    const lbl = row.querySelector('.bar-label');
    if (lbl && lbl.textContent.trim() === label) {
      const valEl = row.querySelector('.bar-val');
      if (valEl) valEl.textContent = count;
    }
  });
}

// Initialize Firestore live listeners
let candidatesUnsub = null;
let fixesCount = 0;
console.log('[dashboard] attaching watchCandidates');
candidatesUnsub = watchCandidates(function(candidates) {
  console.log('[dashboard] watchCandidates fired', candidates?.length);
  if (candidates.length > 0) {
    console.log('[dashboard] first candidate:', JSON.stringify({ city: candidates[0].city, status: candidates[0].status, createdAt: candidates[0].createdAt }));
  }
  updateDashboard(candidates);
  window.dbAllCandidates = candidates;
});

// Fixes count
getFixes().then(function(fixes) {
  fixesCount = fixes ? fixes.length : 0;
  var s5 = document.getElementById('s5');
  if (s5) s5.textContent = fixesCount;
  window.dbFixesCount = fixesCount;
}).catch(function() { /* silent */ });


// Referrals this month
let referralsUnsub = watchReferrals(function(referrals) {
  var now = new Date();
  var thisMonth = referrals.filter(function(r) {
    if (!r.createdAt) return false;
    var d = r.createdAt.toDate ? r.createdAt.toDate() : new Date(r.createdAt);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
  var s2 = document.getElementById('s2');
  if (s2) s2.textContent = thisMonth.length;
  window.dbReferralsThisMonth = thisMonth.length;
});
</script>
</body>
</html>
